<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../img/iconos/robot_logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunicados — Portal Pilot</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/auditoria.css">
  <link rel="stylesheet" href="css/pp-pages.css">
  <link rel="stylesheet" href="../css/notifications.css">
  <style>
    body {
      background-color: var(--bg, #04040a);
      background-image: url('../img/fondo-principal.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
  </style>
</head>

<body>
  <!-- PRELOADER -->
  <div class="preloader" id="preloader">
    <div class="preloader-inner">
      <div class="device">
        <div class="device__a">
          <div class="device__a-1"></div>
          <div class="device__a-2"></div>
        </div>
        <div class="device__b"></div>
        <div class="device__c"></div>
        <div class="device__d"></div>
        <div class="device__e"></div>
        <div class="device__f"></div>
        <div class="device__g"></div>
      </div>
      <div class="preloader-logo">PORTAL <span>PILOT</span></div>
    </div>
  </div>

  <div id="progress">
    <div id="progress-fill"></div>
  </div>
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>
  <div id="cursor-glow"></div>
  <div class="overlay" id="overlay"></div>

  <div class="dashboard" id="dashboard">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 class="logo">PORTAL PILOT</h2>
      </div>
      <a href="perfil.html" class="profile-section" style="text-decoration:none;cursor:pointer;" title="Ver perfil">
        <img src="../img/asuka.png" alt="Perfil" class="avatar"
          onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80'">
        <div class="profile-info">
          <span class="name">Admin</span>
          <span class="role">Super Administrador</span>
        </div>
      </a>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <button class="footer-btn" id="darkModeToggle"><i class="fas fa-moon"></i> <span>Dark Mode</span></button>
        <button class="footer-btn logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>Cerrar Sesión</span></button>
      </div>
      <button class="toggle-btn" id="toggleSidebar" aria-label="Toggle Sidebar"><i class="fas fa-chevron-right"></i></button>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title">Comunicados <span>masivos</span></div>
        </div>
        <div class="topbar-right">
          <button class="topbar-btn" title="Notificaciones"><i class="fas fa-bell"></i><span class="badge" data-notif-badge style="display:none;">0</span></button>
        </div>
      </header>

      <div class="page-header">
        <div>
          <h1 class="page-title">Envío a <span>clientes</span></h1>
          <p class="page-subtitle">Avisos in-app dirigidos a un tenant o a todos: mantenimientos, cambios de plan, cortes programados. Se entregan en la campana de notificaciones de cada usuario.</p>
        </div>
      </div>

      <div class="pp-grid-2 pp-section">
        <!-- Formulario -->
        <div class="pp-card">
          <div class="pp-card-title"><i class="fas fa-paper-plane"></i> Nuevo comunicado</div>
          <div class="form-group">
            <label>Destinatario</label>
            <select id="cDestino">
              <option value="ALL">📢 Todos los clientes (broadcast)</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Tipo</label>
              <select id="cTipo">
                <option value="info">Informativo</option>
                <option value="warning">Advertencia</option>
                <option value="success">Éxito / novedad</option>
                <option value="error">Crítico / corte</option>
              </select>
            </div>
            <div class="form-group">
              <label>Prioridad</label>
              <select id="cPrioridad">
                <option value="baja">Baja</option>
                <option value="normal" selected>Normal</option>
                <option value="alta">Alta</option>
                <option value="critica">Crítica</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Título <span class="req">*</span></label>
            <input type="text" id="cTitulo" maxlength="150" placeholder="Mantenimiento programado el sábado 4:00–6:00 AM">
          </div>
          <div class="form-group">
            <label>Mensaje <span class="req">*</span></label>
            <textarea id="cMensaje" rows="4" placeholder="Detalle del aviso para los usuarios del cliente..."></textarea>
          </div>
          <div class="form-group">
            <label>Enlace opcional</label>
            <input type="url" id="cLink" placeholder="https://portalpilot.hn/estado-de-servicio">
          </div>
          <button class="btn btn-acc" style="width:100%;justify-content:center;" id="cSendBtn" onclick="enviarComunicado()"><i class="fas fa-paper-plane"></i> Enviar comunicado</button>
        </div>

        <!-- Historial -->
        <div class="pp-card">
          <div class="pp-card-title" style="justify-content:space-between;">
            <span><i class="fas fa-clock-rotate-left"></i> Historial de comunicados</span>
            <button class="btn btn-ghost btn-xs" onclick="loadData()"><i class="fas fa-sync-alt"></i></button>
          </div>
          <div id="historialList" style="max-height:520px;overflow-y:auto;"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../auth-check.js"></script>
  <script src="js/portal-admin-guard.js"></script>
  <script src="js/notif-badge.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/sidebar-loader.js"></script>
  <script src="js/pp-sidebar.js"></script>
  <script src="js/comunicados.js"></script>
  <script>
    (function () {
      const dot = document.getElementById('cursor-dot'), ring = document.getElementById('cursor-ring'), glow = document.getElementById('cursor-glow');
      if (!dot || !ring || !glow) return;
      let mx = 0, my = 0, rx = 0, ry = 0;
      document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; dot.style.left = mx + 'px'; dot.style.top = my + 'px'; glow.style.left = mx + 'px'; glow.style.top = my + 'px'; });
      function animRing() { rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; requestAnimationFrame(animRing); }
      animRing();
    })();
    (function () {
      var preloader = document.getElementById('preloader');
      var start = Date.now();
      function hide() {
        if (!preloader || preloader.classList.contains('hidden')) return;
        var delay = Math.max(0, 900 - (Date.now() - start));
        setTimeout(function () { preloader.classList.add('hidden'); }, delay);
      }
      if (document.readyState === 'complete') { hide(); }
      window.addEventListener('load', hide);
      setTimeout(hide, 3200);
    })();
  </script>
</body>

</html>
