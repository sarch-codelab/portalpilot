<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../img/iconos/robot_logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pilot — Centro de acceso</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Impact', 'Arial Black', sans-serif;
            overflow: hidden;
            perspective: 1000px;
            color: #ffffff;
            user-select: none;
        }

        .audio-unlocker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            cursor: pointer;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .unlocker-hint {
            font-size: 4rem;
            animation: pulseClick 1.8s infinite ease-in-out;
            filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.8));
        }

        @keyframes pulseClick {

            0%,
            100% {
                opacity: 0.5;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        .system-credits {
            position: fixed;
            top: 25px;
            left: 25px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #222;
            letter-spacing: 2px;
            z-index: 20;
            text-transform: uppercase;
        }

        .origin-credits {
            position: fixed;
            bottom: 25px;
            right: 25px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #222;
            letter-spacing: 3px;
            z-index: 20;
            text-transform: uppercase;
        }

        .cinema-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 160px;
            text-align: center;
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .word-box {
            position: absolute;
            width: 100%;
            line-height: 160px;
            font-size: 6.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 12px;
            transform-origin: 50% 50% -80px;
            transform: rotateX(-90deg);
            opacity: 0;
            backface-visibility: hidden;
            transition: transform 0.5s cubic-bezier(0.7, 0, 0.3, 1), opacity 0.3s;
        }

        .word-box.visible {
            transform: rotateX(0deg);
            opacity: 1;
        }

        .word-box.exit {
            transform: rotateX(90deg);
            opacity: 0;
        }

        .word-box.final-zoom {
            transition: transform 1.2s cubic-bezier(0.7, 0, 1, 1), opacity 0.8s, filter 0.8s;
            transform: scale(25);
            opacity: 0;
            filter: blur(20px);
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .redirect-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Courier New', monospace;
            font-size: 1.4rem;
            color: #ffffff;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0;
            z-index: 30;
        }

        @keyframes pulseText {

            0%,
            100% {
                opacity: 0.3;
                text-shadow: 0 0 10px rgba(186, 85, 211, 0.5);
            }

            50% {
                opacity: 1;
                text-shadow: 0 0 35px rgba(216, 191, 216, 1);
            }
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 60%, rgba(0, 0, 0, 0.2) 40%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 15;
        }
    </style>
    <link rel="stylesheet" href="../css/notifications.css">
    <style>
/* ─── PRELOADER (device loader) ──────────────── */
.preloader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 50%, #12121e 0%, #08080f 55%, #050509 100%);
    font-size: 16px;
    opacity: 1;
    transition: opacity 0.5s ease, visibility 0.5s ease;
}
.preloader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}
.preloader-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
}
.preloader-logo {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(216, 210, 240, 0.55);
}
.preloader-logo span {
    color: #a78bfa;
}
.device {
    position: relative;
    width: 4em;
    height: 4em;
}
.device__a,
.device__a-1,
.device__a-2,
.device__b,
.device__c,
.device__d,
.device__e,
.device__f,
.device__g {
    animation: device-a 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    position: absolute;
    transition: background-color 0.3s, box-shadow 0.3s;
}
.device__a,
.device__d,
.device__e {
    background-color: hsl(264, 12%, 26%);
    box-shadow: 0 0 0 0.25em inset;
}
.device__a {
    border-radius: 0.375em;
    top: 0;
    width: 4em;
    height: 2.5em;
    z-index: 1;
}
.device__a-1,
.device__a-2 {
    visibility: hidden;
}
.device__a-1 {
    animation-name: device-a-1;
    top: 2.25em;
    left: 1.5em;
    width: 1em;
    height: 0.25em;
}
.device__a-2 {
    animation-name: device-a-2;
    top: 0.625em;
    right: 0;
    width: 0.25em;
    height: 0.75em;
}
.device__a-1,
.device__a-2,
.device__b,
.device__c,
.device__f,
.device__g {
    background-color: #d8d2f0;
    border-radius: 0.125em;
}
.device__b {
    animation-name: device-b;
    top: 2.25em;
    left: 1.875em;
    width: 0.25em;
    height: 1em;
}
.device__c {
    animation-name: device-c;
    top: 3em;
    left: 1em;
    width: 2em;
    height: 0.25em;
}
.device__d,
.device__e {
    left: 1.25em;
    width: 1.5em;
    height: 0.875em;
    visibility: hidden;
}
.device__d {
    animation-name: device-d;
    border-radius: 0.375em 0.375em 0 0;
    top: 0.75em;
}
.device__e {
    animation-name: device-e;
    border-radius: 0 0 0.375em 0.375em;
    top: 1.625em;
}
.device__f,
.device__g {
    filter: blur(0.375em);
    bottom: 0;
    height: 0.25em;
}
.device__f {
    animation-name: device-f;
    opacity: 0.5;
    left: 1em;
    width: 2em;
}
.device__g {
    animation-name: device-g;
    opacity: 0;
    left: 0;
    width: 4em;
}
@keyframes device-a {
    from, to { animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0); left: 0; width: 4em; height: 2.5em; transform: translateY(0); }
    12.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); left: 0; width: 4em; height: 2.5em; transform: translateY(1.5em); }
    25% { animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0); left: 0; width: 4em; height: 2.5em; transform: translateY(0.375em); }
    37.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); left: 0; width: 4em; height: 2.5em; transform: translateY(1.5em); }
    50% { animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0); left: 1em; width: 2em; height: 3em; transform: translateY(0.125em); }
    62.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); left: 1em; width: 2em; height: 3em; transform: translateY(1em); }
    75% { animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0); left: 1em; width: 2em; height: 2em; transform: translateY(0.625em); }
    87.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); left: 1em; width: 2em; height: 2em; transform: translateY(1.375em); }
}
@keyframes device-a-1 {
    from { animation-timing-function: steps(1, end); left: 1.5em; width: 1em; transform: translateY(0); visibility: hidden; }
    12.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); left: 1.5em; width: 1em; transform: translateY(0); visibility: visible; }
    25%, 37.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); left: 1.5em; width: 1em; transform: translateY(-0.5em); visibility: visible; }
    50%, 62.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); left: 0.875em; width: 0.25em; transform: translateY(0); visibility: visible; }
    75%, to { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); left: 0.875em; width: 0.25em; transform: translateY(-0.5em); visibility: hidden; }
}
@keyframes device-a-2 {
    from { animation-timing-function: steps(1, end); transform: translate(0, 0.375em); visibility: hidden; }
    62.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); transform: translate(0, 0.375em); visibility: visible; }
    75%, 87.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); transform: translate(0.375em, 0); visibility: visible; }
    to { transform: translate(0, 0.25em); visibility: visible; }
}
@keyframes device-b {
    from, to { animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0); transform: translateY(0); visibility: visible; }
    10%, 12.5% { animation-timing-function: steps(1, start); transform: translateY(0.75em); visibility: visible; }
    25% { animation-timing-function: steps(1, start); top: 2.25em; left: 1.875em; transform: translateY(0.75em); visibility: hidden; }
    87.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); transform: translateY(0.75em); visibility: hidden; }
}
@keyframes device-c {
    from, to { animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0); transform: translateY(0); visibility: visible; width: 2em; }
    10%, 12.5% { animation-timing-function: steps(1, start); transform: translateY(0.75em); visibility: visible; width: 2em; }
    25% { animation-timing-function: steps(1, start); top: 3em; left: 1em; width: 2em; transform: translateY(0.75em); visibility: hidden; }
    87.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); left: 1.5em; transform: translateY(0.75em); visibility: hidden; width: 1em; }
}
@keyframes device-d {
    from { animation-timing-function: steps(1, end); transform: translateY(0.25em); visibility: hidden; }
    62.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); transform: translateY(0.25em); visibility: visible; }
    75% { animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0); transform: translateY(-0.75em); }
    87.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); transform: translateY(0); }
    to { transform: translateY(-0.75em); }
}
@keyframes device-e {
    from { animation-timing-function: steps(1, end); transform: translateY(1.5em); visibility: hidden; }
    62.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); transform: translateY(1.5em); visibility: visible; }
    75% { animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0); transform: translateY(0.75em); }
    87.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); transform: translateY(1.5em); }
    to { transform: translateY(0); }
}
@keyframes device-f {
    from { animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0); filter: blur(0.375em); }
    12.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); filter: blur(0.1875em); opacity: 0.5; }
    25%, to { filter: blur(0.375em); opacity: 0; }
}
@keyframes device-g {
    from, 12.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); background-color: #d8d2f0; filter: blur(0.1875em); opacity: 0; }
    25% { animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0); background-color: #d8d2f0; filter: blur(0.375em); opacity: 0.5; }
    37.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); filter: blur(0.1875em); opacity: 0.5; left: 0; width: 4em; }
    50%, 75%, to { animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0); filter: blur(0.375em); opacity: 0.5; left: 1em; width: 2em; }
    62.5%, 87.5% { animation-timing-function: cubic-bezier(0.33, 1, 0.67, 1); filter: blur(0.1875em); opacity: 0.5; left: 1em; width: 2em; }
}
    </style>
</head>

<body>

    <!-- PRELOADER -->
    <div class="preloader" id="preloader">
        <div class="preloader-inner">
            <div class="device">
                <div class="device__a">
                    <div class="device__a-1"></div>
                    <div class="device__a-2"></div>
                </div>
                <div class="device__b"></div>
                <div class="device__c"></div>
                <div class="device__d"></div>
                <div class="device__e"></div>
                <div class="device__f"></div>
                <div class="device__g"></div>
            </div>
            <div class="preloader-logo">PORTAL <span>PILOT</span></div>
        </div>
    </div>

    <div id="unlocker" class="audio-unlocker">
        <div class="unlocker-hint">👆</div>
    </div>

    <div class="system-credits">Gracias por usar Portal Pilot</div>

    <div class="cinema-container">

    <script src="../auth-check.js"></script>
    <script>
        // Obtener datos del usuario desde localStorage
        const storedName = localStorage.getItem('userName') || "Usuario";
        const firstName = storedName.split(' ')[0] || "Usuario";
        const storedTenant = localStorage.getItem('empresaCodigo') || "ROOT";
        const storedTenantName = localStorage.getItem('empresaNombre') || null;
        
        let tenantName = "Portal Pilot";
        let targetPath = "dashboard.html";
        
        if (storedTenant.toUpperCase() !== "ROOT" && storedTenant.trim() !== "") {
            tenantName = storedTenantName || storedTenant; // Usar el nombre real si existe
            targetPath = "../empresa/dashboard.html"; // Dashboard de empresa
        } else {
            tenantName = "Portal Pilot";
            targetPath = "dashboard.html"; // Dashboard Admin de Portal Pilot
        }

        const phrases = ["Bienvenido/a", "a", tenantName, firstName + "."];
        const wordDisplay = document.getElementById('wordDisplay');
        const redirectText = document.getElementById('redirectText');
        const canvas = document.getElementById('waterCanvas');
        const ctx = canvas.getContext('2d');
        const unlocker = document.getElementById('unlocker');

        let audioCtx = null;
        let sequenceStarted = false;
        let masterGain = null;
        let reverbNode = null;
        let reverbGain = null;
        let dryGain = null;

        unlocker.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                setupAudioGraph();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            unlocker.style.display = 'none';
            if (!sequenceStarted) {
                sequenceStarted = true;
                runSequence();
            }
        });

        function setupAudioGraph() {
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 1.6; // Aumentado para mejor volumen

            dryGain = audioCtx.createGain();
            dryGain.gain.value = 1.0; // Aumentado para mejor volumen

            reverbGain = audioCtx.createGain();
            reverbGain.gain.value = 0.55;

            reverbNode = audioCtx.createConvolver();
            const reverbBuffer = createReverbImpulse(3.5, 2.5);
            reverbNode.buffer = reverbBuffer;

            dryGain.connect(masterGain);
            reverbNode.connect(reverbGain);
            reverbGain.connect(masterGain);
            masterGain.connect(audioCtx.destination);
        }

        function createReverbImpulse(duration, decay) {
            const sampleRate = audioCtx.sampleRate;
            const length = sampleRate * duration;
            const impulse = audioCtx.createBuffer(2, length, sampleRate);

            for (let channel = 0; channel < 2; channel++) {
                const channelData = impulse.getChannelData(channel);
                for (let i = 0; i < length; i++) {
                    channelData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
                }
            }
            return impulse;
        }

        function playTypeSound() {
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(dryGain);
            gain.connect(reverbNode);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(800 + Math.random() * 150, now);

            filter.type = 'lowpass';
            filter.frequency.value = 2500;
            filter.Q.value = 1;

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.4, now + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

            osc.start(now);
            osc.stop(now + 0.04);
        }

        function playFlipSound() {
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            const bufferSize = audioCtx.sampleRate * 0.4;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const noiseData = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                noiseData[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuffer;

            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(dryGain);
            gain.connect(reverbNode);

            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1200, now);
            filter.frequency.exponentialRampToValueAtTime(180, now + 0.35);
            filter.Q.value = 2;

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.28, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

            noise.start(now);
            noise.stop(now + 0.35);

            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            subOsc.connect(subGain);
            subGain.connect(dryGain);

            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(90, now);
            subOsc.frequency.exponentialRampToValueAtTime(45, now + 0.3);

            subGain.gain.setValueAtTime(0, now);
            subGain.gain.linearRampToValueAtTime(0.2, now + 0.01);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

            subOsc.start(now);
            subOsc.stop(now + 0.3);

            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.connect(oscGain);
            oscGain.connect(dryGain);
            oscGain.connect(reverbNode);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(700, now);
            osc.frequency.exponentialRampToValueAtTime(280, now + 0.3);

            oscGain.gain.setValueAtTime(0, now);
            oscGain.gain.linearRampToValueAtTime(0.12, now + 0.01);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

            osc.start(now);
            osc.stop(now + 0.3);
        }

        function playZoomSound() {
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            const subFilter = audioCtx.createBiquadFilter();

            subOsc.connect(subFilter);
            subFilter.connect(subGain);
            subGain.connect(dryGain);

            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(35, now);
            subOsc.frequency.exponentialRampToValueAtTime(140, now + 1.2);

            subFilter.type = 'lowpass';
            subFilter.frequency.value = 250;

            subGain.gain.setValueAtTime(0, now);
            subGain.gain.linearRampToValueAtTime(0.6, now + 0.1);
            subGain.gain.linearRampToValueAtTime(0.5, now + 0.9);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + 1.3);

            subOsc.start(now);
            subOsc.stop(now + 1.3);

            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            const filter1 = audioCtx.createBiquadFilter();

            osc1.connect(filter1);
            filter1.connect(gain1);
            gain1.connect(dryGain);
            gain1.connect(reverbNode);

            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(220, now);
            osc1.frequency.exponentialRampToValueAtTime(900, now + 1.0);

            filter1.type = 'lowpass';
            filter1.frequency.setValueAtTime(450, now);
            filter1.frequency.exponentialRampToValueAtTime(1800, now + 1.0);

            gain1.gain.setValueAtTime(0, now);
            gain1.gain.linearRampToValueAtTime(0.3, now + 0.1);
            gain1.gain.linearRampToValueAtTime(0.25, now + 0.8);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

            osc1.start(now);
            osc1.stop(now + 1.2);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();

            osc2.connect(gain2);
            gain2.connect(dryGain);
            gain2.connect(reverbNode);

            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(440, now);
            osc2.frequency.exponentialRampToValueAtTime(2000, now + 1.0);

            gain2.gain.setValueAtTime(0, now);
            gain2.gain.linearRampToValueAtTime(0.14, now + 0.15);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.1);

            osc2.start(now);
            osc2.stop(now + 1.1);

            const bufferSize = audioCtx.sampleRate * 1.3;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const noiseData = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                noiseData[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuffer;

            const noiseFilter = audioCtx.createBiquadFilter();
            const noiseGain = audioCtx.createGain();

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(dryGain);

            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(220, now);
            noiseFilter.frequency.exponentialRampToValueAtTime(1400, now + 1.0);

            noiseGain.gain.setValueAtTime(0, now);
            noiseGain.gain.linearRampToValueAtTime(0.1, now + 0.1);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

            noise.start(now);
            noise.stop(now + 1.2);
        }

        function playWaterSplashSound() {
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            // Conectar al mismo grafo que los demás sonidos
            osc.connect(gain);
            gain.connect(dryGain);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(70, now);
            osc.frequency.linearRampToValueAtTime(10, now + 1.8);

            gain.gain.setValueAtTime(0.9, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);

            osc.start(now);
            osc.stop(now + 1.8);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let ripples = [];

        function addRipple(x, y, radius, maxRadius, speed, width, opacity) {
            ripples.push({ x, y, radius, maxRadius, speed, width, opacity });
        }

        function animateWater() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = ripples.length - 1; i >= 0; i--) {
                let r = ripples[i];
                r.radius += r.speed;
                let life = 1 - (r.radius / r.maxRadius);

                if (life <= 0) {
                    ripples.splice(i, 1);
                    continue;
                }

                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(168, 85, 247, ${life * r.opacity})`;
                ctx.lineWidth = r.width * life;
                ctx.shadowBlur = 40 * life;
                ctx.shadowColor = '#a855f7';
                ctx.stroke();
                ctx.closePath();
                ctx.shadowBlur = 0;
            }

            if (ripples.length > 0 || redirectText.style.opacity === "1") {
                requestAnimationFrame(animateWater);
            }
        }

        let currentPhraseIndex = 0;

        function typePhrase(phrase, callback) {
            wordDisplay.innerHTML = "";
            wordDisplay.className = "word-box visible";
            let charIndex = 0;

            function nextChar() {
                if (charIndex < phrase.length) {
                    wordDisplay.innerHTML += phrase[charIndex];
                    playTypeSound();
                    charIndex++;
                    setTimeout(nextChar, 30 + Math.random() * 20);
                } else {
                    setTimeout(callback, 800);
                }
            }
            nextChar();
        }

        function runSequence() {
            if (currentPhraseIndex < phrases.length) {
                let phrase = phrases[currentPhraseIndex];

                typePhrase(phrase, () => {
                    if (currentPhraseIndex < phrases.length - 1) {
                        wordDisplay.className = "word-box exit";
                        playFlipSound();
                        currentPhraseIndex++;
                        setTimeout(runSequence, 500);
                    } else {
                        setTimeout(() => {
                            playZoomSound();
                            wordDisplay.className = "word-box visible final-zoom";
                            setTimeout(triggerWaterExplosion, 500);
                        }, 400);
                    }
                });
            }
        }

        function triggerWaterExplosion() {
            playWaterSplashSound();
            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;
            let maxRadius = Math.sqrt(canvas.width ** 2 + canvas.height ** 2) / 1.5;

            addRipple(centerX, centerY, 0, maxRadius, 14, 25, 1.0);
            setTimeout(() => addRipple(centerX, centerY, 0, maxRadius, 10, 10, 0.6), 100);
            setTimeout(() => addRipple(centerX, centerY, 0, maxRadius, 7, 6, 0.4), 250);

            animateWater();

            redirectText.style.opacity = "1";
            redirectText.style.animation = "pulseText 1.2s infinite";
            
            setTimeout(() => {
                window.location.href = targetPath;
            }, 1800);
        }
    </script>
    <script src="../js/notifications.js"></script>
    <script src="../js/sidebar-loader.js"></script>
    <script>
    (function () {
        var preloader = document.getElementById('preloader');
        var start = Date.now();
        function hide() {
            if (!preloader || preloader.classList.contains('hidden')) return;
            var delay = Math.max(0, 900 - (Date.now() - start));
            setTimeout(function () { preloader.classList.add('hidden'); }, delay);
        }
        if (document.readyState === 'complete') { hide(); }
        window.addEventListener('load', hide);
        setTimeout(hide, 3200);
    })();
    </script>
</body>
